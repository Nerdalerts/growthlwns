  - id: "ref_04"
    question: "Which digital marketing ad campaign generated the highest click-through rate?"
    category: "refusal"
    difficulty: "easy"
    should_refuse: true
    ground_truth_sql: null

  - id: "ref_05"
    question: "What was our gross profit margin after subtracting wholesale COGS?"
    category: "refusal"
